# Copy to config.ini and run: chmod 600 config.ini
# config.ini is git-ignored; never commit real passwords.

[ntu]
host = mail.ntu.edu.tw
port = 995
# NTU Mail runs Microsoft Exchange; if login fails, try the full address
user = b12345678@ntu.edu.tw
password = YOUR_NTU_MAIL_PASSWORD

[gmail]
user = you@gmail.com
# Google Account -> Security -> 2-Step Verification -> App passwords
app_password = xxxx xxxx xxxx xxxx

[options]
# Gmail label to import into (INBOX = normal inbox). Use ASCII names.
mailbox = INBOX
# Delete from NTU Mail after a successful import
delete_after_import = false
state_file = seen_uids.json
